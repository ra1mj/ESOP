[package]
name = "esop-cfggen"
version = "0.1.0"
description = "Deterministic ESOP product configuration generator"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
esop-ethercat-core = { path = "../esop-ethercat-core" }
esop-lifecycle-guard = { path = "../esop-lifecycle-guard", features = ["procbuf", "cia402"] }
esop-procbuf = { path = "../esop-procbuf" }
esop-profile-cia402 = { path = "../esop-profile-cia402", features = ["ethercat"] }
quick-xml = "0.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[lib]
name = "esop_cfggen"
path = "src/lib.rs"

[[bin]]
name = "esop-cfggen"
path = "src/main.rs"
