[package]
name = "esop-zenoh-gateway"
version = "0.1.0"
description = "Allocation-free Zenoh namespace and route policy for ESOP supervision"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
zenoh = ["dep:zenoh"]

[dependencies]
zenoh = { version = "1.10.1", optional = true }

[lib]
name = "esop_zenoh_gateway"
path = "src/lib.rs"
