[package]
name = "esop-zenoh-gateway"
version = "0.1.0"
description = "Allocation-free Zenoh namespace and route policy for ESOP supervision"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
zenoh = [
    "dep:esop-command-gateway",
    "dep:esop-lifecycle-guard",
    "dep:esop-proto",
    "dep:serde_json",
    "dep:zenoh",
]

[dependencies]
esop-command-gateway = { path = "../esop-command-gateway", optional = true }
esop-lifecycle-guard = { path = "../esop-lifecycle-guard", optional = true }
esop-proto = { path = "../esop-proto", optional = true }
serde_json = { version = "1.0.145", optional = true }
zenoh = { version = "1.10.1", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }

[lib]
name = "esop_zenoh_gateway"
path = "src/lib.rs"
