[package]
name = "esop-product-config"
version = "0.1.0"
description = "Fail-closed no-std attachment for generated ESOP product configurations"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
esop-ethercat-core = { path = "../esop-ethercat-core" }
esop-lifecycle-guard = { path = "../esop-lifecycle-guard", features = ["procbuf", "cia402"] }
esop-procbuf = { path = "../esop-procbuf" }
esop-profile-cia402 = { path = "../esop-profile-cia402", features = ["ethercat"] }

[lib]
name = "esop_product_config"
path = "src/lib.rs"
