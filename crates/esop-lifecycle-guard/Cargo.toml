[package]
name = "esop-lifecycle-guard"
version = "0.1.0"
description = "Fail-closed motion lifecycle guard for ESOP"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
std = []
procbuf = ["dep:esop-procbuf"]
ethercat = ["dep:esop-ethercat-core"]
cia402 = ["dep:esop-profile-cia402"]

[dependencies]
esop-ethercat-core = { path = "../esop-ethercat-core", optional = true }
esop-profile-cia402 = { path = "../esop-profile-cia402", features = ["ethercat"], optional = true }
esop-procbuf = { path = "../esop-procbuf", optional = true }

[lib]
name = "esop_lifecycle_guard"
path = "src/lib.rs"
