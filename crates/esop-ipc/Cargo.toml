[package]
name = "esop-ipc"
version = "0.1.0"
description = "Bounded nonblocking Unix domain IPC transport for ESOP supervision"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "esop_ipc"
path = "src/lib.rs"

[features]
default = []
payloads = [
    "dep:esop-command-gateway",
    "dep:esop-lifecycle-guard",
    "dep:esop-procbuf",
    "dep:esop-proto",
]

[dependencies]
esop-command-gateway = { path = "../esop-command-gateway", optional = true }
esop-lifecycle-guard = { path = "../esop-lifecycle-guard", optional = true }
esop-procbuf = { path = "../esop-procbuf", optional = true }
esop-proto = { path = "../esop-proto", optional = true }

[dev-dependencies]
esop-lifecycle-guard = { path = "../esop-lifecycle-guard", features = ["procbuf"] }
