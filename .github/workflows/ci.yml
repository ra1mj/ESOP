name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
          components: rustfmt, clippy
      - name: Run Rust quality gate
        run: make ci
      - name: Install Zenoh router
        run: cargo install zenohd --version 1.10.1 --locked
      - name: Run Zenoh router integration tests
        run: make test-zenoh
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: esop-build-evidence
          path: build/*_report.json
          if-no-files-found: error

  bpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install eBPF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Build CO-RE BPF object
        run: |
          mkdir -p bpf/build
          cp bpf/vmlinux.h bpf/build/vmlinux.h
          make -C bpf
