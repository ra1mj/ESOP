name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
          components: rustfmt, clippy
      - name: Run Rust quality gate
        run: make ci

  bpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install eBPF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang linux-tools-common linux-tools-generic
          bpftool_path="$(find /usr/lib/linux-tools -type f -name bpftool -print -quit)"
          test -n "$bpftool_path" || bpftool_path="$(command -v bpftool)"
          test -x "$bpftool_path"
          sudo ln -sf "$bpftool_path" /usr/local/bin/bpftool
          /usr/local/bin/bpftool version
      - name: Build CO-RE BPF object
        run: make bpf
