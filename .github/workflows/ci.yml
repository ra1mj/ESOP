name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
          components: rustfmt, clippy
      - name: Run Rust quality gate
        run: make ci

  bpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install eBPF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang linux-tools-common linux-tools-generic
          bpftool_path="$(command -v bpftool || find /usr/lib/linux-tools -name bpftool -print -quit)"
          test -x "$bpftool_path"
          bpftool_dir="$(dirname "$bpftool_path")"
          echo "$bpftool_dir" >> "$GITHUB_PATH"
      - name: Build CO-RE BPF object
        run: make bpf
